# Copy to `mcb_config.ini` and fill in real values. `mcb_config.ini` is gitignored.
#
# Add one [ChildN] section per student. `name` is the display name used in the
# digest; `username` and `password` are the parent-portal login for that child.

[Global]
log_file = mcb_scheduler.log

[Child1]
name = FirstChild
username = REPLACE_WITH_PORTAL_USERNAME
password = REPLACE_WITH_PORTAL_PASSWORD

# Uncomment and fill in for a second child:
# [Child2]
# name = SecondChild
# username = REPLACE_WITH_PORTAL_USERNAME
# password = REPLACE_WITH_PORTAL_PASSWORD
